name: sync-fork

# 每天北京时间 09:30，由 GitHub 服务器把上游 morluto/rea 的 main 同步进本 fork。
# 不依赖本机运行；需要时可到 Actions 页手动 Run workflow。
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main from upstream morluto/rea
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo sync "${{ github.repository }}" --source morluto/rea --branch main
